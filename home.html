<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="stage">
        <form class="search-container" action="https://www.google.com/search" method="get" role="search">
            <input type="search" id="search" name="q" placeholder="Search..." aria-label="Search"
                   autocomplete="on" spellcheck="false" required autofocus>
        </form>

        <!-- Alt+T opens Tasks, Alt+N opens Notes, pressing the other key switches -->
        <section id="workspace" class="workspace" data-view="tasks" aria-label="Tasks and notes" aria-hidden="true" inert>
            <div class="app">
                <nav class="side" aria-label="Folders">
                    <div class="side-head">
                        <h2>Folders</h2>
                        <button id="add-folder" class="icon-btn" type="button" aria-label="Add folder">+</button>
                    </div>
                    <input id="folder-input" class="folder-input" hidden maxlength="24" autocomplete="off"
                           placeholder="New folder" aria-label="New folder name">
                    <ul id="tree" class="tree"></ul>
                </nav>

                <section class="main">
                    <header class="main-head">
                        <div class="tabs" role="tablist">
                            <button class="tab" role="tab" type="button" data-view="tasks" aria-controls="view-tasks">Tasks</button>
                            <button class="tab" role="tab" type="button" data-view="notes" aria-controls="view-notes">Notes</button>
                        </div>
                        <span id="crumb" class="crumb"></span>
                    </header>

                    <div class="views">
                        <div id="view-tasks" class="view" role="tabpanel">
                            <form id="task-form" class="add-bar" autocomplete="off">
                                <input id="task-input" type="text" maxlength="200" placeholder="Add a task" aria-label="New task">
                                <input id="task-due" type="date" aria-label="Deadline">
                            </form>
                            <!-- <p id="task-empty" class="empty">Nothing to do in this folder.</p> -->
                            <ul id="task-list" class="items tasks"></ul>
                            <button id="show-done" class="show-done" type="button" hidden></button>
                        </div>

                        <div id="view-notes" class="view" role="tabpanel">
                            <button id="add-note" class="add-row" type="button">+ New note</button>
                            <!-- <p id="note-empty" class="empty">No notes in this folder yet.</p> -->
                            <ul id="note-list" class="items notes"></ul>
                        </div>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
